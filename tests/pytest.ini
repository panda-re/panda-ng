# The tests are scripts with PANDA_TEST metadata, collected by tests/pandatest (tests/run), not
# pytest test modules: pytest's own Python collection is off.
[pytest]
python_files = PANDATEST_NO_PYTHON_MODULES
norecursedirs = programs plugins perf pandatest syscalls2 __pycache__ .*
addopts = -p no:cacheprovider
