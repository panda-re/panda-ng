name: Build

# The expensive half, gated behind Series so a broken patch never burns an
# Arc runner on an hours-long QEMU build.
#
# Mirrors rehosting/qemu's build.yml, plus one assertion the fork could not
# make: check-delta-present.sh proves every per-arch patch actually contributed
# code to the built libraries.

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # The fast gate. Everything below is gated on it.
  series:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/series.yml

  build:
    needs: series
    runs-on: rehosting-arc
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner directories
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Set up Nix
        uses: rehosting/ci/actions/nix-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-backend: cachix
          cachix-name: rehosting-tools
          cachix-auth-token: ${{ secrets.CACHIX_REHOSTING }}
          # No VM needed; avoids install-nix-action's KVM/udevadm step, which
          # fails on Arc pods that expose /dev/kvm without a working udevd.
          enable-kvm: false
          extra-nix-config: |
            max-jobs = 8
            cores = 8

      - name: Flake check
        run: nix flake check -L

      - name: Build release artifact
        run: |
          set -eux
          nix build -L .#dist
          # .#dist is a single-output derivation whose $out IS the tarball, so
          # this copies a file. Building .#penguin-qemu^dist instead would link
          # result to the unpacked tree and silently copy a directory.
          cp --dereference result penguin-qemu.tar.gz

      - name: Verify artifact layout
        run: |
          set -eux
          test -s penguin-qemu.tar.gz
          tar tzf penguin-qemu.tar.gz | grep -q '^lib/libqemu-system-'
          tar tzf penguin-qemu.tar.gz | grep -q '^include/penguin-qemu-cffi/'
          tar tzf penguin-qemu.tar.gz | grep -q '^lib/penguin-qemu-env/'
          tar tzf penguin-qemu.tar.gz | grep -q '^bin/qemu-img$'

      # The boot gate we ship is a minimal boot, which passes even if the whole
      # delta is inert. This is the cheap partial fix: assert the symbols the
      # core, callbacks and per-arch hypercall patches must contribute are
      # actually in every built library.
      - name: IGLOO delta is present in the built libraries
        run: |
          set -eux
          nix build -L .#penguin-qemu --out-link built
          ./scripts/check-delta-present.sh built

      # configs/default.json's --enable-* group is a set of HARD enables, so a
      # missing library is a configure failure. The subtler drift this catches:
      # a flag flipped to --disable-* while its nixDep stays declared, silently
      # dropping a feature.
      - name: Config contract — declared nixDeps are in the runtime closure
        run: ./scripts/check-config-contract.sh "$(readlink -f built)"

      - name: Every declared arch produced a library
        run: |
          set -eu
          python3 - <<'PY'
          import json, pathlib, sys
          d = json.load(open("configs/default.json"))
          have = {p.name for p in pathlib.Path("built/lib").glob("libqemu-system-*.so")}
          want = {f"libqemu-system-{a}.so" for a in d["systemArches"]}
          missing = sorted(want - have)
          if missing:
              sys.exit("missing libraries for declared arches: " + " ".join(missing))
          print(f"ok: all {len(want)} declared arches have a library")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: penguin-qemu.tar.gz
          path: penguin-qemu.tar.gz
          retention-days: 7
