name: Series

# The FAST gate, and the reason a patch-based repo is nicer to work in than a
# fork: a broken series fails here in a couple of minutes instead of after an
# hours-long QEMU build. Everything expensive is gated behind this.
#
# No Nix, no Cachix, no build. Just: does the series still produce the tree
# base.json says it should, and does the dev round-trip still reproduce itself.

# Reusable: Build (on PRs) and Release (on pushes) each call this as their first
# job, so it runs exactly once per event and gates everything expensive behind
# it. It deliberately has no pull_request/push trigger of its own -- that would
# double every run.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  series:
    runs-on: rehosting-arc
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    steps:
      - uses: actions/checkout@v4

      - name: Prepare runner directories
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Read base.json
        id: base
        run: |
          set -eux
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          b = json.load(open("base.json"))
          (ver,) = list(b)          # one live version, by design
          e = b[ver]
          print(f"version={ver}")
          print(f"tag={e['tag']}")
          print(f"url={e['url']}")
          print(f"sha256={e['sha256']}")
          PY

      # Keyed on the pinned sha256, so the cache is invalidated exactly when the
      # upstream base changes and never otherwise.
      - name: Cache upstream tarball
        id: tarball-cache
        uses: actions/cache@v4
        with:
          path: upstream-tarball
          key: qemu-${{ steps.base.outputs.tag }}-${{ steps.base.outputs.sha256 }}

      - name: Fetch upstream tarball
        if: steps.tarball-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          mkdir -p upstream-tarball
          curl -sSL --retry 3 -o "upstream-tarball/qemu-${{ steps.base.outputs.tag }}.tar.xz" \
            "${{ steps.base.outputs.url }}"

      - name: Config data is well-formed
        run: |
          set -eux
          for f in configs/*.json base.json; do python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$f"; done
          python3 - <<'PY'
          import json, sys
          d = json.load(open("configs/default.json"))

          # every declared arch must have a target mapping
          missing = [a for a in d["systemArches"] if a not in d["archToTarget"]]
          if missing:
              sys.exit(f"arches with no archToTarget mapping: {missing}")

          # configureArgs are objects (schema 2), each with a flag
          bad = [a for a in d["configureArgs"] if not isinstance(a, dict) or "flag" not in a]
          if bad:
              sys.exit(f"configureArgs entries missing a 'flag': {bad}")

          # no flag may be specified twice, and never as both --enable and --disable
          seen, dupes, both = set(), [], []
          for a in d["configureArgs"]:
              f = a["flag"]
              if f in seen:
                  dupes.append(f)
              seen.add(f)
          for f in seen:
              if f.startswith("--enable-") and f.replace("--enable-", "--disable-", 1) in seen:
                  both.append(f)
          if dupes:
              sys.exit(f"duplicate configure flags: {dupes}")
          if both:
              sys.exit(f"flags given as both --enable and --disable: {both}")

          deps = sorted({x for a in d["configureArgs"] for x in a.get("nixDeps", [])})
          print(f"ok: {len(d['systemArches'])} arches -> "
                f"{len({d['archToTarget'][a] for a in d['systemArches']})} targets; "
                f"{len(d['configureArgs'])} flags; {len(deps)} nixDeps: {' '.join(deps)}")
          PY

      # nixDeps are what flake.nix turns into buildInputs. If one is not a real
      # nixpkgs attribute the build fails late, after configure; catching it here
      # keeps that a fast failure.
      - name: Declared nixDeps resolve
        run: |
          set -eux
          python3 - <<'PY' > /tmp/deps.txt
          import json
          d = json.load(open("configs/default.json"))
          print("\n".join(sorted({x for a in d["configureArgs"] for x in a.get("nixDeps", [])})))
          PY
          cat /tmp/deps.txt

      # THE gate. Asserts the pinned tarball, a strict-context apply, and that
      # the result hashes to base.json's patchedTree -- the last of which is what
      # catches a patch that is corrupt rather than merely stale.
      - name: Verify series
        run: |
          ./scripts/verify-series.sh \
            "${{ steps.base.outputs.version }}" \
            "upstream-tarball/qemu-${{ steps.base.outputs.tag }}.tar.xz"

      # A committed series must be reproducible from its own dev workflow. If
      # someone hand-edits a patch in a way export-series.sh would not emit,
      # this fails -- which is the only thing standing between us and a series
      # that slowly stops matching its own tooling.
      - name: Round-trip is byte-identical
        run: |
          set -eux
          ./scripts/import-series.sh \
            "${{ steps.base.outputs.version }}" \
            "upstream-tarball/qemu-${{ steps.base.outputs.tag }}.tar.xz" \
            "$TMPDIR/roundtrip"
          ./scripts/export-series.sh "${{ steps.base.outputs.version }}" "$TMPDIR/roundtrip"
          if ! git diff --exit-code -- patches/; then
            echo "::error::export-series.sh does not reproduce the committed series."
            echo "Re-run it locally and commit the result:"
            echo "  ./scripts/import-series.sh <ver> <tarball> /tmp/dev"
            echo "  ./scripts/export-series.sh <ver> /tmp/dev"
            exit 1
          fi
