name: Off-cost

# "Built in but off costs nothing", measured: stock (this repo's main) and this
# series, built from the same pinned tarball with the same configure line, boot the guest
# harness's kernels (x86_64, aarch64) and run the same workloads; the series
# must stay within TOL of stock, and an rr-ready launch within RRTOL of a plain
# one. scripts/offcost-gate.sh is the whole gate; this only provides inputs.
#
# Manual for now: about 90 guest boots (10 minutes) plus two QEMU builds, and it wants a
# quiet runner (noise on a shared host fails it, not the code). It has not run
# on the Arc runners yet; it was developed and run in a Linux VM with the same
# script. Add a pull_request trigger once it has a few green dispatches.

on:
  workflow_dispatch:
    inputs:
      reps:
        description: "Runs per build per workload"
        required: false
        default: "5"
      tol:
        description: "Allowed series/stock slowdown (fraction)"
        required: false
        default: "0.05"

jobs:
  offcost:
    runs-on: rehosting-arc
    timeout-minutes: 240
    env:
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # STOCK_REF=origin/main is read with git archive

      - name: Prepare runner directories
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Set up Nix
        uses: rehosting/ci/actions/nix-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-backend: cachix
          cachix-name: rehosting-tools
          cachix-auth-token: ${{ secrets.CACHIX_REHOSTING }}
          enable-kvm: false

      - name: Fetch upstream tarball
        id: base
        run: |
          set -eux
          read -r tag url < <(python3 -c 'import json;(e,)=json.load(open("base.json")).values();print(e["tag"],e["url"])')
          mkdir -p upstream-tarball
          curl -sSL --retry 3 -o "upstream-tarball/qemu-$tag.tar.xz" "$url"
          echo "tarball=$PWD/upstream-tarball/qemu-$tag.tar.xz" >> "$GITHUB_OUTPUT"

      # kernels, busybox and the initrds; the plugins are not used by the gate
      - name: Guest inputs
        run: |
          set -eux
          nix shell nixpkgs#gcc nixpkgs#pkg-config nixpkgs#glib nixpkgs#squashfsTools nixpkgs#cpio \
            nixpkgs#llvm nixpkgs#python3 -c env ARCHES="x86_64 aarch64" tests/guest/prepare.sh

      - name: Gate
        run: |
          set -eux
          nix develop .#penguin-qemu -c env REPS=${{ inputs.reps }} TOL=${{ inputs.tol }} JOBS=8 \
            nix shell nixpkgs#bc -c ./scripts/offcost-gate.sh 11.1.0 "${{ steps.base.outputs.tarball }}" \
            "$TMPDIR/offcost" "$PWD/offcost-out"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offcost
          path: offcost-out
          retention-days: 14
