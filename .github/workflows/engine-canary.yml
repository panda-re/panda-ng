name: Engine upstream canary

# Weekly early warning (engine/README.md, rebasing): probe the committed series against upstream
# QEMU's master (or the refs given) and report which patches would need a human. It gates nothing.
# Ported from qemu_builder's upstream-canary.yml.
#
# Strict-only mode (PROBE_STRICT_ONLY=1): `git am --3way` rebuilds a patch's pre-image from its
# index-line blob hashes, which a fresh upstream clone doesn't have, so a drift/conflict split
# would be meaningless here. The reported count is therefore an upper bound: context drift that
# 3-way would resolve by itself counts as needing work. Run engine/scripts/probe-versions.sh
# against a full clone for the split.
#
# Output: the job summary, and on panda-re/panda-ng one rolling issue labelled upstream-canary
# (commented on, not duplicated). Nothing is published or released.

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays, 07:00 UTC
  workflow_dispatch:
    inputs:
      refs:
        description: "Upstream refs to probe (space-separated), e.g. upstream/master v11.1.2"
        required: false
        default: "upstream/master"

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream refs
        id: upstream
        run: |
          set -eux
          REFS="${{ github.event.inputs.refs || 'upstream/master' }}"
          git init -q "$RUNNER_TEMP/qemu-upstream"
          cd "$RUNNER_TEMP/qemu-upstream"
          git remote add upstream https://gitlab.com/qemu-project/qemu.git
          for r in $REFS; do
            # Shallow is enough: the probe only checks out the ref itself.
            git fetch -q --depth 1 upstream "${r#upstream/}"
            git update-ref "refs/remotes/$r" FETCH_HEAD
          done
          echo "head=$(git rev-parse --short refs/remotes/upstream/master 2>/dev/null || echo n/a)" >> "$GITHUB_OUTPUT"

      - name: Probe the series
        id: probe
        run: |
          set -eu
          REFS="${{ github.event.inputs.refs || 'upstream/master' }}"
          ver=$(python3 -c 'import json;(v,)=json.load(open("engine/base.json"));print(v)')
          PROBE_STRICT_ONLY=1 ./engine/scripts/probe-versions.sh "$ver" \
            "$RUNNER_TEMP/qemu-upstream" $REFS | tee probe.txt
          sum() { grep -o "$1=[0-9]*" probe.txt | cut -d= -f2 | awk '{n+=$1} END {print n+0}'; }
          echo "conflicts=$(sum conflict)" >> "$GITHUB_OUTPUT"
          echo "moved=$(sum moved)" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Engine upstream canary"
            echo
            echo "upstream master: \`${{ steps.upstream.outputs.head }}\`"
            echo
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rolling issue
        if: ${{ github.repository == 'panda-re/panda-ng' && (steps.probe.outputs.conflicts != '0' || steps.probe.outputs.moved != '0') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          {
            echo "Probed the engine's series against upstream QEMU at \`${{ steps.upstream.outputs.head }}\`."
            echo
            echo "- patches that no longer apply with strict context: **${{ steps.probe.outputs.conflicts }}** (an upper bound: see engine-canary.yml)"
            echo "- patches whose target file moved upstream: **${{ steps.probe.outputs.moved }}**"
            echo
            echo '```'
            cat probe.txt
            echo '```'
            echo
            echo "[run]($RUN_URL)"
          } > body.md
          n=$(gh issue list --label upstream-canary --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body-file body.md
          else
            gh label create upstream-canary --color BFD4F2 --force >/dev/null
            gh issue create --title "Engine upstream canary: the series needs porting" \
              --label upstream-canary --body-file body.md
          fi
