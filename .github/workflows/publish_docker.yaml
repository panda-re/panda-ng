name: Build and Publish Docker Container and Pypanda Docs # Only for main panda-re repo, not forks

on:
  push:
    branches:
      - main

jobs:
  build_release_assets:
    if: github.repository  == 'panda-re/panda-ng' && github.ref == 'refs/heads/main'
    runs-on: panda-arc
    steps:
      - name: Install git
        run: sudo apt-get -qq update -y && sudo apt-get -qq install git curl jq -y
      
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get next version
        uses: reecetech/version-increment@2023.10.2
        id: version
        with:
          release_branch: main
          use_api: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host
          buildkitd-config-inline: |
            [registry."${{ secrets.PANDA_ARC_REGISTRY }}"]
              insecure = true
              http = true
      
      - name: 'Login to Docker Registry'
        uses: docker/login-action@v3
        with:
          username: pandare
          password: ${{secrets.pandare_dockerhub}}
      
      - name: Trust Harbor's self-signed certificate
        run: |
          echo "Fetching certificate from registry"
          openssl s_client -showcerts -connect ${{ secrets.PANDA_ARC_REGISTRY }}:443 < /dev/null 2>/dev/null | openssl x509 -outform PEM | sudo tee /usr/local/share/ca-certificates/harbor.crt > /dev/null
          sudo update-ca-certificates

      - name: Log in to Rehosting Arc Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.PANDA_ARC_REGISTRY }}
          username: ${{ secrets.PANDA_ARC_REGISTRY_USER }}
          password: ${{ secrets.PANDA_ARC_REGISTRY_PASSWORD }}
      
      - name: Build panda:latest
        uses: docker/build-push-action@v6.18.0
        with:
          push: true
          load: true
          context: ${{ github.workspace }}
          tags: |
            pandare/panda-ng-plugins:${{ github.sha }}
            pandare/panda-ng-plugins:${{ steps.version.outputs.v-version }}
            pandare/panda-ng-plugins:latest
          cache-from: |
            type=registry,ref=${{secrets.PANDA_ARC_REGISTRY}}/pandare/panda-ng-plugins:cache,mode=max
          cache-to: |
            type=registry,ref=${{secrets.PANDA_ARC_REGISTRY}}/pandare/panda-ng-plugins:cache,mode=max
          build-args: |
            REGISTRY=${{ secrets.PANDA_ARC_REGISTRY }}/proxy
            OVERRIDE_VERSION=${{ steps.version.outputs.version }}
      
      - name: Build panda packager
        uses: docker/build-push-action@v6.18.0
        with:
          push: false
          load: true
          target: packager
          context: ${{ github.workspace }}
          tags: |
            pandare/panda-ng-plugins:${{ github.sha }}-packager
          cache-from: |
            type=registry,ref=${{secrets.PANDA_ARC_REGISTRY}}/pandare/panda-ng-plugins:cache,mode=max
            type=registry,ref=${{secrets.PANDA_ARC_REGISTRY}}/pandare/panda-ng-plugins:packagecache,mode=max
          cache-to: |
            type=registry,ref=${{secrets.PANDA_ARC_REGISTRY}}/pandare/panda-ng-plugins:packagecache,mode=max
          build-args: |
            REGISTRY=${{ secrets.PANDA_ARC_REGISTRY }}/proxy
            OVERRIDE_VERSION=${{ steps.version.outputs.version }}

      - name: Build panda packager
        uses: docker/build-push-action@v6.18.0
        with:
          push: false
          load: true
          target: cleanup
          context: ${{ github.workspace }}
          tags: |
            pandare/panda-ng-plugins:${{ github.sha }}-cleanup
          cache-from: |
            type=registry,ref=${{secrets.PANDA_ARC_REGISTRY}}/pandare/panda-ng-plugins:cache,mode=max
            type=registry,ref=${{secrets.PANDA_ARC_REGISTRY}}/pandare/panda-ng-plugins:packagecache,mode=max
          build-args: |
            REGISTRY=${{ secrets.PANDA_ARC_REGISTRY }}/proxy
            OVERRIDE_VERSION=${{ steps.version.outputs.version }}

      - name: Build package
        working-directory: debian
        run: |
          docker run --rm -v $(pwd):/out pandare/panda-ng-plugins:${{ github.sha }}-cleanup bash -c "cp /panda-ng/python/core/dist/pandare2-*.whl /out"
          docker run --rm -v $(pwd):/out pandare/panda-ng-plugins:${{ github.sha }}-packager bash -c "cp /pandare-plugins.deb /out"
          mv pandare-plugins.deb pandare-plugins_22.04.deb
      
      - name: Upload wheel and debian packages to release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.v-version }}
          files: |
            debian/pandare*.deb
            debian/pandare2*.whl