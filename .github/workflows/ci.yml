name: CI

# Every PR, whatever it touches (plugins/, python/, tests/, rust/, tools/, engine/, ...): build what
# users run, check the flake, and start the engine once. Builds and checks only; nothing publishes.
# engine.yml adds the series gates when engine/ or the flake changes; the guest suite (tests/run.sh)
# needs images and hours of TCG and is not run here.
#
#   build     nix build .#python (the 13-target engine, the plugins, pandare2), tests/smoke.py
#             x86_64 (firmware boot, C plugins load, a Python callback runs), nix flake check
#             (the series applies, each qemu-system-<arch> starts, wheel repair), and the
#             examples/consumer flake against this tree (an out-of-tree plugin runs).
#   rust      the checked-in bindings compile for every target feature.
#
# Binary cache: the public Cachix cache pandare, through rehosting/ci's nix-setup. Pushes to main
# push what they built (with the org secret CACHIX_AUTH_TOKEN); PRs only pull, so an engine that
# main hasn't built yet compiles from source (16 min on 6 cores; longer on a runner).
# release.yaml writes VERSION first, so its builds differ from these and won't hit.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main] # fills the cache PRs pull from
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # The runner images start with ~14-20 GB free; the engine's build tree plus its closure
      # needs more. Drop toolchains this job doesn't use (as wheel.yaml does).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /opt/microsoft /opt/google /usr/lib/jvm
          sudo docker image prune --all --force > /dev/null || true
          df -h /
      - uses: actions/checkout@v4
      - name: Set up Nix
        uses: rehosting/ci/actions/nix-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-backend: cachix
          cachix-name: pandare
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extra-nix-config: |
            min-free = 4294967296
            max-free = 12884901888
      - name: Build pandare2's Python (engine, plugins, pandare2)
        run: nix build -L --out-link result-python .#python
      - name: Smoke (x86_64 firmware, plugins, a Python callback)
        run: ./result-python/bin/python3 tests/smoke.py x86_64
      - name: Flake check
        run: nix flake check -L
      # The documented consumer flake, pointed at this tree instead of GitHub.
      - name: examples/consumer against this tree
        working-directory: examples/consumer
        run: |
          nix flake check -L --no-write-lock-file --override-input panda-ng "git+file://$GITHUB_WORKSPACE"
      - name: Disk
        if: always()
        run: df -h /

  rust:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/panda-bindings
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Bindings compile for every target
        run: |
          set -eu
          for f in $(sed -n '/^\[features\]/,/^\[/{s/ *= *\[\].*//p}' Cargo.toml); do
            echo "== $f"
            nix shell --inputs-from ../.. nixpkgs#cargo nixpkgs#rustc -c cargo check --locked --features "$f"
          done
