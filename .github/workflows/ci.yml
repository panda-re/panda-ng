name: CI

# Every PR, whatever it touches (plugins/, python/, tests/, rust/, tools/, engine/, ...): build what
# users run, check the flake, and start the engine once. Builds and checks only; nothing publishes.
# engine.yml adds the series gates when engine/ changes; the guest suite (tests/run.sh)
# needs images and hours of TCG and is not run here, except its taint tests on small busybox guests
# when a PR touches taint or record/replay (below).
#
#   build     nix build .#python (the 13-target engine, the plugins, pandare2), tests/smoke.py
#             x86_64 (firmware boot, C plugins load, a Python callback runs), nix flake check
#             (the series applies, the delta is in every library, each qemu-system-<arch> starts,
#             wheel repair), and the examples/consumer flake against this tree (an out-of-tree
#             plugin runs).
#   build-arm64  nix build .#python on an aarch64 host (ubuntu-24.04-arm), as release.yaml does
#             after the merge: the engine's layout depends on the host (pthread sizes, which
#             accelerators it builds), and release.yaml runs only on main.
#   rust      the checked-in bindings compile for every target feature.
#   reuse     every file has its copyright and license (REUSE 3.3: LICENSES/, REUSE.toml, SPDX tags).
#
# Binary cache: the public Cachix cache pandare, through rehosting/ci's nix-setup. Pushes to main
# and PRs from branches of this repo push what they built (with the org secret CACHIX_AUTH_TOKEN),
# so a stacked PR, a re-run and main after the merge pull the engine instead of compiling it again
# (~26 min on a miss, ~4 on a hit). Fork PRs have no secret and only pull.
# release.yaml writes VERSION first, so its builds differ from these and won't hit.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main] # fills the cache PRs pull from
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push supersedes a PR's run; main's runs each finish (they fill the cache).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      # No disk cleanup: ubuntu-24.04 starts with ~86 GB free on / and the build peaks ~15 GB.
      - uses: actions/checkout@v4
      - name: Set up Nix
        uses: rehosting/ci/actions/nix-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-backend: cachix
          cachix-name: pandare
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # nix-setup skips the push on every pull_request; only forks need to (no secret).
          skip-push: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          extra-nix-config: |
            min-free = 4294967296
            max-free = 12884901888
      - name: Build pandare2's Python (engine, plugins, pandare2)
        run: nix build -L --out-link result-python .#python
      - name: Smoke (x86_64 firmware, plugins, a Python callback)
        run: ./result-python/bin/python3 tests/smoke.py x86_64
      # Taint and the record/replay under it on 11 arches (tests/busybox.sh: small busybox guests,
      # about 3 minutes with the download), only when the PR touches what they depend on: the
      # engine (TCG, record/replay, the targets' snapshot state), pandare2's taint and disk set-up,
      # syscalls2, or the tests. Pushes to main always run it. The nightly guest suite runs it too.
      - name: Does the change touch taint or record/replay?
        id: busybox
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo run=1 >> "$GITHUB_OUTPUT"; exit 0; fi
          # The checkout is the PR's merge commit; diffing its tree against the base's needs no history.
          git fetch -q --depth=1 origin ${{ github.event.pull_request.base.sha }}
          if git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD | grep -qE \
              '^(engine/|flake\.(nix|lock)$|plugins/syscalls2/|python/core/pandare2/(taint|panda|qcows_internal)\.py$|tests/(taint|taint_mmio|mkbusybox)\.py$|tests/(busybox|run)\.sh$)'; then
            echo run=1 >> "$GITHUB_OUTPUT"
          else
            echo "no taint or record/replay paths changed: skipping the busybox guests"
          fi
      - name: Restore the busybox-guest downloads
        if: steps.busybox.outputs.run
        uses: actions/cache@v4
        with:
          path: ~/.cache/panda-busybox
          key: panda-busybox-${{ hashFiles('tests/busybox.sh') }}
      - name: Taint and record/replay on 11 arches (busybox guests)
        if: steps.busybox.outputs.run
        env:
          PANDA_PYTHON: ${{ github.workspace }}/result-python/bin/python3
          OUT: ${{ github.workspace }}/busybox-out
          IMAGES: ${{ runner.temp }}/busybox-images
        run: tests/busybox.sh
      - name: Busybox-guest logs
        if: failure() && steps.busybox.outputs.run
        uses: actions/upload-artifact@v4
        with:
          name: busybox-guests
          path: |
            busybox-out/results
            busybox-out/**/*.log
          retention-days: 14
      - name: Flake check
        run: nix flake check -L
      # The documented consumer flake, pointed at this tree instead of GitHub.
      - name: examples/consumer against this tree
        working-directory: examples/consumer
        run: |
          nix flake check -L --no-write-lock-file --override-input panda-ng "git+file://$GITHUB_WORKSPACE"
      - name: Disk
        if: always()
        run: df -h /

  build-arm64:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Set up Nix
        uses: rehosting/ci/actions/nix-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-backend: cachix
          cachix-name: pandare
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          extra-nix-config: |
            min-free = 4294967296
            max-free = 12884901888
      - name: Build pandare2's Python (engine, plugins, pandare2) on aarch64
        run: nix build -L --out-link result-python .#python
      - name: Disk
        if: always()
        run: df -h /

  rust:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/panda-bindings
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Bindings compile for every target
        run: |
          set -eu
          for f in $(sed -n '/^\[features\]/,/^\[/{s/ *= *\[\].*//p}' Cargo.toml); do
            echo "== $f"
            nix shell --inputs-from ../.. nixpkgs#cargo nixpkgs#rustc -c cargo check --locked --features "$f"
          done

  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
