site_name: panda-ng
site_description: PANDA on QEMU 11.1, driven from Python
repo_url: https://github.com/panda-re/panda-ng
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

nav:
  - Overview: index.md
  - Features: features.md
  - Reference:
      - Python API: reference/python.md
      - Callbacks: reference/callbacks.md
      - Engine patches: reference/patches.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python/core]
          options:
            docstring_style: google
            # missing type annotations are pandare2's norm; wrong parameter names still fail the build
            docstring_options: { warn_missing_types: false }
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.highlight
  # Guides take their code from the tests (--8<-- "tests/rr.py:record"), so every example runs.
  - pymdownx.snippets: { base_path: ["."], check_paths: true, dedent_subsections: true }

exclude_docs: |
  features.toml
